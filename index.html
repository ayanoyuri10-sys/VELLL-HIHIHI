<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raken Game Official</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial Black', Impact, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* CARA GANTI BACKGROUND: Ganti 'bg.jpg' dengan nama/link gambar kamu */
            background: url('6eab1f4f76b45b856ce94aa1ae5da18d (2).jpg') no-repeat center center/cover #ffffff;
        }

        .container {
            width: 100%;
            max-width: 380px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        /* Foto Profil Lingkaran Merah */
        .profile-circle {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background-color: #e50000;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 32px;
            font-style: italic;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .profile-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Banner Website Official */
        .btn-banner {
            width: 100%;
            background-color: #e50000;
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 17px;
            font-style: italic;
            text-decoration: none;
            border-radius: 3px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        /* Button WhatsApp Style */
        .btn-wa {
            width: 100%;
            background-color: #e50000;
            border-radius: 40px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: white;
            padding: 4px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .btn-wa:hover, .btn-banner:hover {
            transform: scale(1.02);
        }

        .wa-icon-box {
            width: 52px;
            height: 52px;
            background-color: white;
            border: 3px solid #e50000;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e50000;
            font-size: 30px;
            flex-shrink: 0;
        }

        .wa-details {
            flex-grow: 1;
            text-align: center;
            padding-right: 15px;
        }

        .wa-title {
            font-size: 17px;
            font-style: italic;
            font-weight: bold;
            display: block;
            line-height: 1.2;
        }

        .wa-subtitle {
            font-size: 11px;
            font-style: italic;
            font-family: Arial, sans-serif;
            font-weight: normal;
            display: block;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-circle">
            <img src="profile.jpg" alt="Profile" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <span style="display:none;">Profile</span>
        </div>

        <a href="https://raken-game.id" class="btn-banner" target="_blank">
            official raken game.id website
        </a>

        <a href="https://Wa.me/+62895325977434" class="btn-wa" target="_blank">
            <div class="wa-icon-box">
                <i class="fa-brands fa-whatsapp"></i>
            </div>
            <div class="wa-details">
                <span class="wa-title">nomer raken game.id</span>
                <span class="wa-subtitle">"langsung diarahkan ke WhatsApp"</span>
            </div>
        </a>

        <a href="https://whatsapp.com/channel/0029VbDlg7nKrWQwOkTpVP1W" class="btn-wa" target="_blank">
            <div class="wa-icon-box">
                <i class="fa-brands fa-whatsapp"></i>
            </div>
            <div class="wa-details">
                <span class="wa-title">saluran testimoni raken</span>
                <span class="wa-subtitle">"langsung diarahkan ke WhatsApp"</span>
            </div>
        </a>
    </div>

</body>
</html>
