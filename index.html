

      <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Data Ultimate Vell</title>
    <style>
        /* Background Oren Gradasi yang modern */
        body {
            background: linear-gradient(135deg, #ff8c00, #ffb347);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Wadah utama */
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 18px; /* Jarak antar elemen */
            margin-top: 20px;
        }

        /* Gaya untuk Banner Gambar biar lebih menyatu */
        .banner.jpg {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            object-fit: cover;
        }

        /* Teks perkenalan dengan efek kaca (putih transparan) */
        .intro-box {
            background-color: rgba(255, 255, 255, 0.9);
            color: #d35400; /* Teks warna oren gelap */
            font-weight: bold;
            font-style: italic;
            text-align: center;
            padding: 15px;
            border-radius: 15px;
            font-size: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* Wadah untuk tombol WhatsApp */
        .wa-container {
            display: flex;
            gap: 12px;
        }

        /* Gaya dasar semua tombol biar bentuknya kapsul modern */
        .btn {
            text-decoration: none;
            font-weight: bold;
            text-align: center;
            padding: 16px 10px;
            border-radius: 30px; /* Bentuk membulat seperti kapsul */
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        /* Efek ditekan (karena kamu pake HP) */
        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Tombol WhatsApp (Warna Putih Elegan) */
        .wa-btn {
            background-color: #ffffff;
            color: #d35400;
            flex: 1;
        }

        /* Tombol Saluran Transaksi (Warna Gelap Kontras) */
        .trans-btn {
            background-color: #2c3e50;
            color: #ffffff;
        }

        /* Tombol Pembayaran (Warna Hitam Pekat) */
        .pay-btn {
            background-color: #1a1a1a;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Gambar Banner Kamu -->
        <img src="banner.jpg" alt="Banner Ultimate Vell" class="banner-img">

        <!-- Bagian Intro -->
        <div class="intro-box">
            "Halo saya Ultimate Vell, ini adalah website data saya."
        </div>

        <!-- Tombol WhatsApp Bersebelahan -->
        <div class="wa-container">
            <a href="https://Wa.me/+6283863366275" class="btn wa-btn">WhatsApp 1</a>
            <a href="https://Wa.me/+62895325977434" class="btn wa-btn">WhatsApp 2</a>
        </div>

        <!-- Tombol Saluran Transaksi -->
        <a href="https://whatsapp.com/channel/0029VbC1CvlIt5s3Swp9hS2b" class="btn trans-btn">Saluran Transaksi</a>

        <!-- Tombol Saluran Pembayaran -->
        <a href="https://whatsapp.com/channel/0029VbCPtREKWEKtTB3wta1K" class="btn pay-btn">Saluran Pembayaran</a>

    </div>

</body>
</html>
